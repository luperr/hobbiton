---
miniflux_http_port: 8080
miniflux_fetch_private_network_feeds: 1

caddy_proxy:
  hostname: miniflux.lan
  scheme: http
  port: "{{ miniflux_http_port }}"

ufw_rules:
  - rule: allow
    port: "{{ miniflux_http_port }}"
    proto: tcp
    src: "{{ ufw_lan_subnet }}"

homer_item:
  name: Miniflux
  subtitle: RSS reader
  icon: fas fa-rss
  group: Household
