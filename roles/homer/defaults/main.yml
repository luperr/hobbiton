---
homer_app_dir: /opt/homer
homer_config_path: "{{ homer_app_dir }}/assets/config.yml"
homer_http_port: 8010

homer_title: hobbiton
homer_subtitle: ""

homer_ping: true
homer_ping_timeout: 2000
homer_ping_success_codes: [200, 204, 301, 302, 304, 307, 308, 400, 401, 403, 405]

homer_group_order:
  - Household
  - Admin

homer_group_icons:
  Household: fas fa-house
  Admin: fas fa-screwdriver-wrench

homer_color_theme: dark

homer_colors_dark:
  highlight-primary: "#1d2021"
  highlight-secondary: "#282828"
  highlight-hover: "#3c3836"
  background: "#282828"
  card-background: "#32302f"
  text: "#ebdbb2"
  text-header: "#fbf1c7"
  text-title: "#fabd2f"
  text-subtitle: "#a89984"
  card-shadow: "rgba(0, 0, 0, 0.4)"
  link: "#83a598"
  link-hover: "#fabd2f"
