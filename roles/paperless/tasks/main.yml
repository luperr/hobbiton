---
- name: Check paperless.conf exists
  ansible.builtin.stat:
    path: "{{ paperless_conf_path }}"
  register: paperless_conf

- name: Assert paperless.conf exists
  ansible.builtin.assert:
    that: paperless_conf.stat.exists
    fail_msg: "{{ paperless_conf_path }} not found — Paperless is installed by the community script, not this role"

- name: Set CSRF trusted origins
  ansible.builtin.lineinfile:
    path: "{{ paperless_conf_path }}"
    regexp: '^#?\s*PAPERLESS_CSRF_TRUSTED_ORIGINS='
    line: "PAPERLESS_CSRF_TRUSTED_ORIGINS={{ paperless_csrf_trusted_origins | join(',') }}"
    backup: true
  notify: Restart paperless webserver
