---
- name: Check data mount is present
  ansible.builtin.command: mountpoint -q {{ calibre_data_mount }}
  changed_when: false
  failed_when: false
  register: mount_check

- name: Assert data mount is present
  ansible.builtin.assert:
    that: mount_check.rc == 0
    fail_msg: "{{ calibre_data_mount }} is not mounted — run configure_storage.yml first"

- name: Create app directory
  ansible.builtin.file:
    path: "{{ calibre_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create data mount subdirectories
  ansible.builtin.file:
    path: "{{ calibre_data_mount }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - config
    - ingest
    - library
    - plugins

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ calibre_data_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  notify: restart calibre-web-automated

- name: Start calibre-web-automated via compose
  community.docker.docker_compose_v2:
    project_src: "{{ calibre_data_dir }}"
    pull: missing
    state: present
